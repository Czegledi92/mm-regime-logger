# JOB-20260917-MM-001 — regime logger config (all thresholds DRAFT)
# Research only — no live trading, no exchange API keys.

job_id: JOB-20260917-MM-001
research_only: true

venue:
  default: BN_AGG
  proxy: true  # DRAFT — BN labels are research proxy until Bitunix book agrees (C4)

session:
  anchor: UTC_DAY  # locked per architecture v0.1

splits:
  develop_frac: 0.6   # DRAFT
  validate_frac: 0.2  # DRAFT
  holdout_frac: 0.2   # DRAFT

thresholds:
  balance:
    range_epsilon_bps: 10       # DRAFT — inner buffer from session extremes
    range_epsilon_frac: 0.05    # DRAFT — fraction of session range width
    range_min_bps: 15           # DRAFT — C1 hard gate R_min before BREAK_CANDIDATE

  break:
    t0_seconds: 10              # DRAFT — sticky time outside boundary
    epsilon_range_bps: 15       # DRAFT — beyond session range edge
    epsilon_vwap_bps: 12        # DRAFT — beyond VWAP band edge

  confirm:
    t_hold_seconds: 45            # DRAFT — hold beyond broken level
    t_hold_single_leg_seconds: 75 # DRAFT — C2 stricter hold when which=range|vwap only
    n_prints_min: 5               # DRAFT — optional print count gate
    v_break_btc: 0.5              # DRAFT — optional signed volume gate
    require_reload: true          # DRAFT — reload/aggression alignment required
    require_cvd_align: true       # DRAFT — CVD alignment required when column present
    confirm_timeout_seconds: 120  # DRAFT — max CONFIRM_WINDOW duration

  sig_pull:
    depth_drop_pct: 0.30          # DRAFT — near-touch depth drop fraction
    window_seconds: 5             # DRAFT
    print_vol_min_btc: 0.1        # DRAFT — prints below this => pull candidate

  quote_walk:
    mid_move_bps_min: 3           # DRAFT — mid move without prints triggers VETO

  vwap:
    band_mode: bps                # DRAFT — "bps" or "sigma" (sigma needs rolling std column)
    band_bps: 50                  # DRAFT
    band_k_sigma: 2.0             # DRAFT

output:
  transition_log: regime_transitions.csv
  summary_json: regime_summary_develop.json
